[package]
name = "sarge-secrets"
version = "0.1.0"
edition = "2021"
authors = ["Sarge Team"]
description = "High-performance, memory-safe multi-cloud secret management"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
async-trait = "0.1"
aes-gcm = "0.10" # For local encryption/decryption
rand = "0.8"
base64 = "0.21"
persistent-cache = "0.1" # For performance caching
