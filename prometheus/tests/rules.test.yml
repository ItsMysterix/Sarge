rule_files:
  - ../alerts.yml

tests:
  - interval: 1m
    input_series:
      - series: 'sarge_deploys_total{status="failed"}'
        values: 0+0x5 1 1 2 2 3 3
      - series: 'sarge_rate_denied_total'
        values: 0+0x3 10 30 60 80 100
    alert_rule_test:
      - eval_time: 15m
        alertname: DeployFailuresSpike
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Deploy failures observed
      - eval_time: 5m
        alertname: RateLimitDenialsHigh
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: High rate-limit denials
