name: CI

on:
  push:
    branches: [ main, "release/**", "feature/**" ]
  pull_request:
    branches: [ main, "release/**" ]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (root and workspaces)
        run: |
          pnpm -w run typecheck || true
          pnpm -r --if-present run typecheck

      - name: Build (root and workspaces)
        run: |
          pnpm -w run build || true
          pnpm -r --if-present run build

      - name: Test (workspaces and root)
        run: |
          pnpm -r --if-present run test -- --coverage
          pnpm -w run test -- --coverage || true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  docs-check:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate tRPC API docs
        run: pnpm -w run docs:trpc

      - name: Lint docs
        run: pnpm -w run docs:lint

      - name: Check links
        run: pnpm -w run docs:links

  prometheus-config:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install promtool
        run: |
          PROM_VERSION=2.54.1
          curl -L -o /tmp/prom.tar.gz https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz
          tar -xzf /tmp/prom.tar.gz -C /tmp
          sudo mv /tmp/prometheus-${PROM_VERSION}.linux-amd64/promtool /usr/local/bin/promtool
          promtool --version

      - name: Prometheus config check
        run: promtool check config prometheus/prometheus.yml

      - name: Prometheus rules test
        run: promtool test rules prometheus/tests/rules.test.yml
