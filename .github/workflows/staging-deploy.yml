name: Staging Deploy

on:
  push:
    branches: [ staging, "release/**" ]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests (not recommended)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  REPO: ${{ github.repository }}
  GHCR_USER: ${{ github.actor }}
  ENVIRONMENT: staging

jobs:
  staging-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        if: ${{ !inputs.skip_tests }}
        run: |
          pnpm -w run typecheck || true
          pnpm -r --if-present run typecheck

      - name: Build
        run: |
          pnpm -w run build || true
          pnpm -r --if-present run build

      - name: Test
        if: ${{ !inputs.skip_tests }}
        run: |
          pnpm -r --if-present run test
          pnpm -w run test || true

      - name: Run staging validation
        env:
          EC2_SSM_TARGET: ${{ secrets.EC2_SSM_TARGET_STAGING }}
          GHCR_PAT_PARAM: ${{ secrets.GHCR_PAT_PARAM }}
        run: |
          node ops/scripts/validate-release.js

  build-staging-images:
    needs: staging-preflight
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ backend, app ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staging image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/sarge-${{ matrix.service }}:staging-${{ github.sha }}
            ghcr.io/${{ github.repository }}/sarge-${{ matrix.service }}:staging-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ENVIRONMENT=staging

  deploy-to-staging:
    needs: [staging-preflight, build-staging-images]
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ secrets.STAGING_URL || 'https://staging.yourdomain.com' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to staging EC2
        env:
          EC2_SSM_TARGET: ${{ secrets.EC2_SSM_TARGET_STAGING }}
          GHCR_PAT_PARAM: ${{ secrets.GHCR_PAT_PARAM }}
        run: |
          set -euo pipefail
          TARGET="$EC2_SSM_TARGET"
          CMD="export REPO='${{ github.repository }}' && export SHA='${{ github.sha }}' && export GHCR_USER='${{ github.actor }}' && export GHCR_PAT_PARAM='${{ secrets.GHCR_PAT_PARAM }}' && export ENVIRONMENT='staging' && /bin/bash /opt/sarge/ssm-deploy.sh"
          
          if [[ "$TARGET" == i-* ]]; then
            aws ssm send-command \
              --document-name AWS-RunShellScript \
              --instance-ids "$TARGET" \
              --parameters commands="$CMD",executionTimeout="3600" \
              --region "${{ env.AWS_REGION }}" > deploy-output.json
          else
            aws ssm send-command \
              --document-name AWS-RunShellScript \
              --targets Key=tag:Name,Values="$TARGET" \
              --parameters commands="$CMD",executionTimeout="3600" \
              --region "${{ env.AWS_REGION }}" > deploy-output.json
          fi
          
          cat deploy-output.json
          COMMAND_ID=$(jq -r '.Command.CommandId' deploy-output.json)
          echo "Deployment command ID: $COMMAND_ID"

      - name: Wait for deployment
        run: |
          echo "Waiting 30 seconds for deployment to complete..."
          sleep 30

      - name: Run smoke tests
        run: |
          STAGING_URL="${{ secrets.STAGING_URL || 'https://staging.yourdomain.com' }}"
          echo "Running smoke tests against $STAGING_URL"
          
          # Health check
          if curl -f -s "$STAGING_URL/api/health" > /dev/null; then
            echo "✅ Health check passed"
          else
            echo "❌ Health check failed"
            exit 1
          fi
          
          # Check main page loads
          if curl -f -s "$STAGING_URL" > /dev/null; then
            echo "✅ Main page loads"
          else
            echo "❌ Main page failed to load"
            exit 1
          fi

      - name: Notify deployment success
        if: success()
        run: |
          echo "🎉 Staging deployment successful!"
          echo "Environment: staging"
          echo "SHA: ${{ github.sha }}"
          echo "URL: ${{ secrets.STAGING_URL || 'https://staging.yourdomain.com' }}"

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "❌ Staging deployment failed!"
          echo "Check the logs above for details"
