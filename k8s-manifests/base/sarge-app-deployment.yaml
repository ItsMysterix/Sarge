#! sarge-app-deployment.yaml
# Generated code, do not edit
apiVersion: apps/v1
kind: Deployment
metadata:
    name: sarge-app
    namespace: sarge
    labels:
        com.docker.compose.project: sarge
        com.docker.compose.service: sarge-app
spec:
    replicas: 1
    selector:
        matchLabels:
            com.docker.compose.project: sarge
            com.docker.compose.service: sarge-app
    strategy:
        type: Recreate
    template:
        metadata:
            labels:
                com.docker.compose.project: sarge
                com.docker.compose.service: sarge-app
                com.docker.compose.network.default: "true"
        spec:
            containers:
                - name: sarge
                  image: sarge-sarge-app
                  imagePullPolicy: IfNotPresent
                  env:
                    - name: NEXTAUTH_SECRET
                      value: "change_this_in_production_use_openssl_rand_base64_32"
                    - name: NEXTAUTH_URL
                      value: "http://localhost:3000"
                    - name: DATABASE_URL
                      value: "postgresql://username:password@ep-example-123456.us-east-1.aws.neon.tech/neondb?sslmode=require"
                    - name: DATABASE_URL_UNPOOLED
                      value: "postgresql://***REDACTED_DB_USER***:***REDACTED_DB_PASSWORD***@***REDACTED_DB_HOST***.us-east-1.aws.neon.tech/neondb?sslmode=require"
                    - name: DEBUG
                      value: "true"
                    - name: NEON_PROJECT_ID
                      value: "***REDACTED_NEON_PROJECT***"
                    - name: NEXT_PUBLIC_API_URL
                      value: "http://localhost:3000/"
                    - name: NEXT_PUBLIC_BACKEND_URL
                      value: "http://localhost:5050/"
                    - name: NEXT_PUBLIC_STACK_PROJECT_ID
                      value: "***REDACTED_STACK_PROJECT_ID***"
                    - name: NEXT_PUBLIC_STACK_PUBLISHABLE_CLIENT_KEY
                      value: "***REDACTED_STACK_CLIENT_KEY***"
                    - name: NODE_ENV
                      value: "development"
                    - name: PGDATABASE
                      value: "neondb"
                    - name: PGHOST
                      value: "***REDACTED_DB_HOST***-pooler.us-east-1.aws.neon.tech"
                    - name: PGHOST_UNPOOLED
                      value: "***REDACTED_DB_HOST***.us-east-1.aws.neon.tech"
                    - name: PGPASSWORD
                      value: "***REDACTED_DB_PASSWORD***"
                    - name: PGUSER
                      value: "***REDACTED_DB_USER***"
                    - name: POSTGRES_PRISMA_URL
                      value: "postgres://***REDACTED_DB_USER***:***REDACTED_DB_PASSWORD***@***REDACTED_DB_HOST***-pooler.us-east-1.aws.neon.tech/neondb?connect_timeout=15&sslmode=require"
                    - name: POSTGRES_URL
                      value: "postgres://***REDACTED_DB_USER***:***REDACTED_DB_PASSWORD***@***REDACTED_DB_HOST***-pooler.us-east-1.aws.neon.tech/neondb?sslmode=require"
                    - name: POSTGRES_URL_NON_POOLING
                      value: "postgres://***REDACTED_DB_USER***:***REDACTED_DB_PASSWORD***@***REDACTED_DB_HOST***.us-east-1.aws.neon.tech/neondb?sslmode=require"
                    - name: STACK_SECRET_SERVER_KEY
                      value: "***REDACTED_STACK_SECRET***"
                  ports:
                    - name: sarge-app-3000
                      containerPort: 3000
                  volumeMounts:
                    - name: app
                      mountPath: /app
            volumes:
                - name: app
                  hostPath:
                    path: W:\Projects\Sarge
