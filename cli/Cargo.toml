[package]
name = "sarge-cli"
version = "0.1.0"
edition = "2021"
authors = ["Sarge Team"]
description = "High-performance CLI for SARGE cloud deployments"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
config = "0.13"
dirs = "5.0"
colored = "2.0"
indicatif = "0.17"
chrono = "0.4"
anyhow = "1.0"
async-trait = "0.1"
