services:
  - type: web
    name: sarge-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /metrics
    envVars:
      - key: NODE_ENV
        value: production
      - key: WS_PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: sarge-db
          property: connectionString

databases:
  - name: sarge-db
    plan: free
