[package]
name = "sarge-bridge"
version = "0.1.0"
edition = "2021"
authors = ["Sarge Team"]
description = "High-performance bridge between TypeScript backend and Rust workers"

[dependencies]
axum = { version = "0.6", features = ["json"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.4", features = ["cors"] }
lazy_static = "1.4"
anyhow = "1.0"
# Local workspace dependencies
sarge-scanner = { path = "../scanner" }
sarge-engine = { path = "../engine" }
sarge-rbac = { path = "../rbac" }
sarge-secrets = { path = "../secrets" }
sarge-gtm = { path = "../gtm" }
sarge-remediation = { path = "../remediation" }
