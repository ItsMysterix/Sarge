version: "3.9"
services:
  localstack:
    image: localstack/localstack:2.3
    container_name: sarge-localstack
    environment:
      - SERVICES=dynamodb,s3
    ports:
      - "4566:4566"
    networks:
      - sarge
  web:
    image: node:18-alpine
    container_name: sarge-web
    working_dir: /workspace/web
    command: "node server.cjs"
    environment:
      - PORT=4010
    ports:
      - "4010:4010"
    volumes:
      - .:/workspace
    networks:
      - sarge
    depends_on:
      - localstack
  api:
    image: node:18-alpine
    container_name: sarge-api
    working_dir: /workspace/api
    command: "node server.cjs"
    environment:
      - PORT=4011
    ports:
      - "4011:4011"
    volumes:
      - .:/workspace
    networks:
      - sarge
    depends_on:
      - localstack
networks:
  sarge: {}
