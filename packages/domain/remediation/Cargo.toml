[package]
name = "sarge-remediation"
version = "0.1.0"
edition = "2021"
authors = ["Sarge Team"]
description = "High-performance Automated Incident Remediation (AEIR) for self-healing infra"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
chrono = "0.4"
# Local workspace dependencies
sarge-engine = { path = "../engine" }
