[package]
name = "sarge-scanner"
version = "0.1.0"
edition = "2021"
authors = ["Sarge Team"]
description = "High-performance security and vulnerability scanner"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
walkdir = "2.3"
regex = "1.9"
chrono = "0.4"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.4", features = ["v4"] }
