user  nginx;
worker_processes  auto;

events { worker_connections  1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile        on;
  keepalive_timeout  65;
  server_tokens off;

  # Log format
  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
  access_log  /var/log/nginx/access.log  main;
  error_log   /var/log/nginx/error.log warn;

  # Upstreams
  upstream app_upstream { server app:3001; }
  upstream backend_http { server backend:3000; }

  # Redirect HTTP to HTTPS
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name _;

    # TLS certs mounted at /etc/nginx/tls
    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # HSTS (adjust max-age as needed). Preload optional.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Client body size (match backend MAX_JSON_BODY_KB; default 512k)
    client_max_body_size 512k;

    # Common proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # App
    location / {
      proxy_pass http://app_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
    }

    # Next.js API routes live on the app service
    location /api/ {
      proxy_pass http://app_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
    }

    # Backend metrics
    location = /metrics {
      proxy_pass http://backend_http/metrics;
      proxy_read_timeout 30s;
    }

    # WebSocket proxy to backend
    location /ws {
      proxy_pass http://backend_http;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
    }
  }
}
