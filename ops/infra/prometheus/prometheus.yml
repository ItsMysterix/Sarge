global:
  scrape_interval: 5s
  evaluation_interval: 30s
  external_labels:
    env: ${ENVIRONMENT}

rule_files:
  - alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:3000"]

  # Optional: include if you expose metrics for app and nginx
  # - job_name: "app"
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ["app:3001"]
  # - job_name: "nginx"
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ["nginx:9113"]
